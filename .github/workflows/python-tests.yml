# Pixi + pixi-build for genai-service (not covered by root `lefthook` lint alone).
name: python-tests

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "services/genai-service/**"
  pull_request:
    paths:
      - "services/genai-service/**"
  merge_group:

jobs:
  test:
    name: genai-service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          manifest-path: services/genai-service/pixi.toml
          frozen: true
          cache: true

      - name: Type check
        run: pixi run --manifest-path services/genai-service/pixi.toml typecheck

      - name: Run tests
        run: pixi run --manifest-path services/genai-service/pixi.toml test
