name: Build Service Images (reusable)

on:
  workflow_call:
    inputs:
      push:
        description: Whether to push images to GHCR.
        type: boolean
        required: true
      primary_tag:
        description: Primary image tag (e.g. release version or branch name).
        type: string
        required: true
      sha_tag:
        description: Secondary image tag (e.g. "latest" on release, or "sha-<sha>" on CI builds).
        type: string
        required: true
      platforms:
        description: Target platforms for the image manifest.
        type: string
        required: true

jobs:
  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend
          - gateway
          - incident-service
          - event-service
          - user-service
          - notification-service
          - webhook-service
          - genai-service
        include:
          - service: frontend
            build_context: ./services
            build_dockerfile: ./services/frontend/Dockerfile
            # Shown as "build <sha>" in the UI sidebar footer.
            build_args: VITE_COMMIT_SHA=${{ github.sha }}
          - service: gateway
            build_context: ./services
            build_dockerfile: ./services/gateway/Dockerfile
          - service: incident-service
            build_context: ./services
            build_dockerfile: ./services/incident-service/Dockerfile
          - service: event-service
            build_context: ./services
            build_dockerfile: ./services/event-service/Dockerfile
          - service: notification-service
            build_context: ./services
            build_dockerfile: ./services/notification-service/Dockerfile
          - service: user-service
            build_context: ./services
            build_dockerfile: ./services/user-service/Dockerfile
          - service: webhook-service
            build_context: ./services
            build_dockerfile: ./services/webhook-service/Dockerfile
          - service: genai-service
            build_context: ./services
            build_dockerfile: ./services/genai-service/Dockerfile

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Normalize image repository
        id: repo
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: ${{ contains(inputs.platforms, 'arm64') }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and optionally push) image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.build_context || format('./services/{0}', matrix.service) }}
          file: ${{ matrix.build_dockerfile || format('./services/{0}/Dockerfile', matrix.service) }}
          build-args: ${{ matrix.build_args || '' }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.lower }}/${{ matrix.service }}:${{ inputs.primary_tag }}
            ghcr.io/${{ steps.repo.outputs.lower }}/${{ matrix.service }}:${{ inputs.sha_tag }}
