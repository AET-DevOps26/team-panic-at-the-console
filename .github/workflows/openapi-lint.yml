name: OpenAPI Lint

on:
  push:
    branches:
      - main
    paths:
      - api/**
      - .github/workflows/openapi-lint.yml
  pull_request:
    paths:
      - api/**
      - .github/workflows/openapi-lint.yml
  merge_group:

jobs:
  lint-openapi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      - name: Lint OpenAPI spec
        run: pixi run openapi-lint

  codegen-validate:
    name: Validate codegen (TypeScript + Python + Java)
    runs-on: ubuntu-latest
    needs: lint-openapi

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate OpenAPI code generation via Pixi task
        run: pixi run openapi-codegen-validate
